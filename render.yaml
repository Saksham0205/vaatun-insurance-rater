services:
  - type: web
    name: vaatun-insurance-rater-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # glibc otherwise gives each threadpool thread its own heap arena, which
      # fragments and keeps RSS high after OCR/rate-card work.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: LOCAL_OCR_THREADS
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
